<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторная №5 — Simon</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <section class="card">
      <header>
        <p class="eyebrow">Лабораторная работа №5</p>
        <h1>Simon</h1>
        <p class="subtitle">Запомните последовательность и повторите её в том же порядке.</p>
      </header>

      <div class="game-panel">
        <div class="simon-board" id="simon-board" aria-label="Игровое поле Simon">
          <button class="pad pad--green" type="button" data-pad="0" aria-label="Зелёный сектор"></button>
          <button class="pad pad--red" type="button" data-pad="1" aria-label="Красный сектор"></button>
          <button class="pad pad--yellow" type="button" data-pad="2" aria-label="Жёлтый сектор"></button>
          <button class="pad pad--blue" type="button" data-pad="3" aria-label="Синий сектор"></button>
        </div>

        <aside class="controls">
          <p class="level" id="level">Уровень: 0</p>
          <p class="status" id="status" aria-live="polite">Нажмите «Старт».</p>
          <button class="start-button" id="start-button" type="button">Старт</button>
          <p class="hint">Во время показа последовательности нажатия игнорируются.</p>
        </aside>
      </div>
    </section>
  </main>
</body>
</html>
