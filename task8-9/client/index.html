<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zen-Money</title><link rel="stylesheet" href="style.css"><script type="module" src="main.js"></script></head><body><main><header><a href="http://localhost:8080/labs-6-16/index.html">← Курс</a><p class="badge">Лабораторные 8–9</p><h1>Zen-Money</h1></header><p id="message" role="status" class="error"></p><section><h2>Сводка по выбранным фильтрам</h2><div id="summary" class="stats"></div></section><section><h2 id="form-title">Новая операция</h2><form id="transaction-form"><label>Сумма<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Тип<select name="type"><option value="expense">Расход</option><option value="income">Доход</option></select></label><label>Категория<select name="category_id" required></select></label><label>Дата<input name="date" type="date" required></label><label>Комментарий<input name="comment" maxlength="1000"></label><button id="save">Добавить</button><button id="cancel" type="button" class="secondary" hidden>Отмена</button></form></section><section><h2>Своя категория</h2><form id="category-form"><input name="name" aria-label="Название категории" placeholder="Название" required maxlength="80"><select name="type" aria-label="Тип категории"><option value="expense">Расход</option><option value="income">Доход</option></select><button>Создать категорию</button></form></section><section><h2>Операции</h2><form id="filters"><label>Тип<select name="type"><option value="">Все</option><option value="income">Доходы</option><option value="expense">Расходы</option></select></label><label>Категория<select name="category_id"><option value="">Все</option></select></label><label>От<input name="from" type="date"></label><label>До<input name="to" type="date"></label><button>Применить</button><button id="reset-filter" type="button" class="secondary">Сбросить</button></form><div id="transactions"></div></section></main></body></html>
