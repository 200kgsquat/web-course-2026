<main><header><p class="badge">Лабораторная 15</p><h1>Todo на Angular</h1><p class="muted">Компонент, двустороннее связывание и сервис с DI</p></header><section><form (ngSubmit)="add()"><input name="text" [(ngModel)]="text" aria-label="Новая задача" placeholder="Что нужно сделать?"><button>Добавить</button></form><p class="error" role="status">{{message}}</p><nav class="filters"><button type="button" (click)="filter='all'" [attr.aria-pressed]="filter==='all'">Все</button><button type="button" (click)="filter='active'" [attr.aria-pressed]="filter==='active'">Активные</button><button type="button" (click)="filter='completed'" [attr.aria-pressed]="filter==='completed'">Завершённые</button></nav><p>Осталось: {{todo.tasks.length-todo.completed}}, Выполнено: {{todo.completed}}</p><p *ngIf="visible.length===0" class="empty">Нет задач в этом фильтре.</p><ul class="list"><li *ngFor="let task of visible; trackBy: trackId" [class.completed]="task.completed"><input type="checkbox" [checked]="task.completed" [attr.aria-label]="'Выполнить: '+task.text" (change)="todo.toggle(task.id)"><span>{{task.text}}</span><button class="danger" (click)="todo.remove(task.id)">Удалить</button></li></ul></section></main>
