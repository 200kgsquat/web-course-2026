<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторная №3 — Todo-list</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>Todo-list</h1>
      <p class="subtitle">Лабораторная работа №3</p>

      <div class="add-row">
        <input id="todo-input" type="text" placeholder="Введите задачу" autocomplete="off">
        <button id="add-button" type="button">Добавить</button>
      </div>

      <p id="message" class="message"></p>

      <div class="filters">
        <button type="button" class="filter active" data-filter="all">Все</button>
        <button type="button" class="filter" data-filter="active">Активные</button>
        <button type="button" class="filter" data-filter="completed">Завершённые</button>
      </div>

      <p id="counter" class="counter">Осталось: 0, Выполнено: 0</p>
      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty" class="empty">Список пока пуст.</p>
    </section>
  </main>
</body>
</html>
